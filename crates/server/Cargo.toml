[package]
name = "janus-scan-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Janus Scan Server: scan from any browser on the network"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "janus-scan-server"
path = "src/main.rs"

[dependencies]
scan-core.workspace = true
backend-sane.workspace = true
imaging.workspace = true
document.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs"] }
export.workspace = true
serde_yaml_ng = "0.10"
libc = "0.2"
zip = { version = "2", default-features = false }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
